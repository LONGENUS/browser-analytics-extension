name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-extension:
    name: Validate Chrome Extension Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: |
          python3 -c "import json; m = json.load(open('extension/manifest.json')); assert m['manifest_version'] == 3; print('Manifest V3 valid:', m['name'], m['version'])"

  validate-backend:
    name: Validate Backend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax check Python files
        run: |
          python -m compileall backend/
