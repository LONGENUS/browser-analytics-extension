<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal Live DOM Extractor Test Suite</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F172A; color: #F8FAFC; padding: 24px; line-height: 1.5; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #38BDF8; }
    .test-card { background: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .test-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .badge-pass { background: #065F46; color: #34D399; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 9999px; }
    .badge-fail { background: #881337; color: #FDA4AF; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 9999px; }
    pre { background: #090D16; border: 1px solid #1E293B; border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; color: #CBD5E1; }
    .summary-box { background: #1E293B; border: 2px solid #2563EB; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <h1>WebIntel — Universal Live DOM Extractor Acceptance Suite</h1>
  <p style="color: #94A3B8; font-size: 13px; margin-bottom: 20px;">
    Validates live extraction on rendered DOMs for: Amazon Product, Amazon Search, Nike Product, eBay Listing, Shopify Store, and Company Website.
  </p>

  <div id="suite-summary" class="summary-box">
    <strong>Running tests...</strong>
  </div>

  <div id="results"></div>

  <!-- Hidden iframe containers for isolated DOM scenarios -->
  <div id="iframes" style="display: none;"></div>

  <script>
    const scenarios = [
      {
        id: 'amazon_product',
        title: 'Acceptance Test 1: Amazon Product Page',
        url: 'https://www.amazon.in/dp/B08N5WRWNW',
        html: `
          <html>
            <head>
              <title>Apple iPhone 13 (128GB) - Midnight: Amazon.in</title>
              <meta name="description" content="15 cm (6.1-inch) Super Retina XDR display. Cinematic mode.">
              <link rel="canonical" href="https://www.amazon.in/dp/B08N5WRWNW">
              <meta property="og:title" content="Apple iPhone 13 (128GB) - Midnight">
              <meta property="og:type" content="product">
              <meta property="og:image" content="https://m.media-amazon.com/images/I/71xb2xkN5qL._SL1500_.jpg">
            </head>
            <body>
              <span id="productTitle">Apple iPhone 13 (128GB) - Midnight</span>
              <a id="bylineInfo">Brand: Apple</a>
              <div id="corePrice_feature_div">
                <span class="a-price"><span class="a-offscreen">₹49,900</span></span>
              </div>
              <span class="basisPrice"><span class="a-offscreen">₹59,900</span></span>
              <span id="acrPopover" title="4.6 out of 5 stars"></span>
              <span id="acrCustomerReviewText">14,203 ratings</span>
              <input id="ASIN" value="B08N5WRWNW">
              <img id="landingImage" src="https://m.media-amazon.com/images/I/71xb2xkN5qL._SL1500_.jpg" alt="iPhone 13">
              <h1>Apple iPhone 13 Flagship</h1>
              <h2>Display & Performance</h2>
              <a href="/dp/accessories">Accessories</a>
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is Amazon', pass: data.platform === 'Amazon' },
            { name: 'PageType is Product', pass: data.pageType === 'Product' },
            { name: 'Extracted 1 product', pass: data.products.length === 1 },
            { name: 'Product title contains iPhone 13', pass: data.products[0]?.product_name.includes('iPhone 13') },
            { name: 'Price is 49900', pass: data.products[0]?.price === 49900 },
            { name: 'Original price is 59900', pass: data.products[0]?.original_price === 59900 },
            { name: 'Discount calculated', pass: data.products[0]?.discount_percent > 0 },
            { name: 'ASIN extracted', pass: data.products[0]?.asin_sku === 'B08N5WRWNW' },
            { name: 'Brand is Apple', pass: data.products[0]?.brand === 'Apple' },
          ];
        }
      },
      {
        id: 'amazon_search',
        title: 'Acceptance Test 2: Amazon Search Results',
        url: 'https://www.amazon.in/s?k=shoes',
        html: `
          <html>
            <head>
              <title>Amazon.in: Shoes</title>
              <meta name="description" content="Online shopping for Shoes from a great selection.">
            </head>
            <body>
              <h1>Results for "shoes"</h1>
              <div data-component-type="s-search-result" data-asin="B07VXYZ123">
                <h2><a href="/dp/B07VXYZ123"><span>Nike Men Running Shoes Air Max</span></a></h2>
                <span class="a-size-base-plus">Nike</span>
                <span class="a-price"><span class="a-offscreen">₹3,499</span></span>
                <span class="a-price" data-a-strike="true"><span class="a-offscreen">₹4,999</span></span>
                <span aria-label="4.3 out of 5 stars"></span>
                <span aria-label="1,240 ratings">1,240</span>
                <img class="s-image" src="https://m.media-amazon.com/images/shoe.jpg" alt="Nike Shoe">
              </div>
              <div data-component-type="s-search-result" data-asin="B08PUMA456">
                <h2><a href="/dp/B08PUMA456"><span>Puma Smashic Casual Sneakers</span></a></h2>
                <span class="a-size-base-plus">Puma</span>
                <span class="a-price"><span class="a-offscreen">₹1,999</span></span>
                <span aria-label="4.1 out of 5 stars"></span>
                <span aria-label="890 ratings">890</span>
                <img class="s-image" src="https://m.media-amazon.com/images/puma.jpg" alt="Puma Sneaker">
              </div>
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is Amazon', pass: data.platform === 'Amazon' },
            { name: 'PageType is Search results', pass: data.pageType === 'Search results' },
            { name: 'Extracted multiple products', pass: data.products.length === 2 },
            { name: 'First product is Nike with price 3499', pass: data.products[0]?.price === 3499 },
            { name: 'Second product is Puma with price 1999', pass: data.products[1]?.price === 1999 },
          ];
        }
      },
      {
        id: 'nike_product',
        title: 'Acceptance Test 3: Nike Product Page',
        url: 'https://www.nike.com/t/air-force-1-07-mens-shoes-jBrhbr/CW2288-111',
        html: `
          <html>
            <head>
              <title>Nike Air Force 1 '07 Men's Shoes. Nike.com</title>
              <meta name="description" content="The radiance lives on with the b-ball OG.">
              <meta property="og:title" content="Nike Air Force 1 '07">
              <meta property="og:type" content="product">
              <meta property="og:image" content="https://static.nike.com/a/images/af1.jpg">
              <script type="application/ld+json">
                {
                  "@context": "https://schema.org/",
                  "@type": "Product",
                  "name": "Nike Air Force 1 '07",
                  "image": ["https://static.nike.com/a/images/af1.jpg"],
                  "description": "The radiance lives on with the b-ball OG.",
                  "sku": "CW2288-111",
                  "brand": { "@type": "Brand", "name": "Nike" },
                  "offers": {
                    "@type": "Offer",
                    "price": "115.00",
                    "priceCurrency": "USD",
                    "availability": "https://schema.org/InStock"
                  },
                  "aggregateRating": {
                    "@type": "AggregateRating",
                    "ratingValue": "4.8",
                    "reviewCount": "2490"
                  }
                }
              <\/script>
            </head>
            <body>
              <h1 data-test="product-title">Nike Air Force 1 '07</h1>
              <div data-test="product-price">$115</div>
              <img data-test="product-image" src="https://static.nike.com/a/images/af1.jpg" alt="Nike AF1">
              <span data-test="reviews-rating">4.8</span>
              <span data-test="reviews-count">(2490)</span>
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is Nike', pass: data.platform === 'Nike' },
            { name: 'PageType is Product', pass: data.pageType === 'Product' },
            { name: 'Extracted 1 product', pass: data.products.length === 1 },
            { name: 'Title matches Nike Air Force 1', pass: data.products[0]?.product_name.includes('Air Force 1') },
            { name: 'Price is $115', pass: data.products[0]?.price === 115 },
            { name: 'SKU is CW2288-111', pass: data.products[0]?.asin_sku === 'CW2288-111' },
            { name: 'Rating is 4.8', pass: data.products[0]?.rating === 4.8 },
            { name: 'JSON-LD detected', pass: data.structuredData?.has_json_ld === true },
          ];
        }
      },
      {
        id: 'ebay_listing',
        title: 'Acceptance Test 4: eBay Listing Page',
        url: 'https://www.ebay.com/itm/123456789',
        html: `
          <html>
            <head>
              <title>Sony PlayStation 5 Disc Edition Console - White | eBay</title>
              <meta name="description" content="Find many great new & used options and get the best deals for Sony PS5.">
            </head>
            <body>
              <h1 class="x-item-title__mainTitle">Sony PlayStation 5 Disc Edition Console - White</h1>
              <div class="x-price-primary"><span class="text-display">US $449.99</span></div>
              <img class="ux-image-filmstrip" src="https://i.ebayimg.com/images/ps5.jpg" alt="PS5 Console">
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is eBay', pass: data.platform === 'eBay' },
            { name: 'PageType is Product', pass: data.pageType === 'Product' },
            { name: 'Extracted 1 product', pass: data.products.length === 1 },
            { name: 'Title contains PlayStation 5', pass: data.products[0]?.product_name.includes('PlayStation 5') },
            { name: 'Price is $449.99', pass: data.products[0]?.price === 449.99 },
            { name: 'ASIN/SKU contains item ID', pass: data.products[0]?.asin_sku === '123456789' },
          ];
        }
      },
      {
        id: 'shopify_store',
        title: 'Acceptance Test 5: Shopify Store Page',
        url: 'https://shop.allbirds.com/products/mens-wool-runners',
        html: `
          <html>
            <head>
              <title>Men's Wool Runners - Allbirds</title>
              <meta name="description" content="Remarkably soft and cozy wool sneakers.">
              <meta name="generator" content="Shopify 2026.03">
              <link rel="canonical" href="https://shop.allbirds.com/products/mens-wool-runners">
              <script type="application/ld+json">
                {
                  "@context": "https://schema.org/",
                  "@type": "Product",
                  "name": "Men's Wool Runners",
                  "brand": "Allbirds",
                  "sku": "AB-WR-001",
                  "offers": {
                    "@type": "Offer",
                    "price": "110.00",
                    "priceCurrency": "USD",
                    "availability": "https://schema.org/InStock"
                  }
                }
              <\/script>
            </head>
            <body>
              <h1 class="product__title">Men's Wool Runners</h1>
              <div class="price-item--regular">$110.00</div>
              <form action="/cart/add" method="post">
                <button type="submit">Add to Cart</button>
              </form>
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is Shopify', pass: data.platform === 'Shopify' },
            { name: 'PageType is Product', pass: data.pageType === 'Product' },
            { name: 'Product extracted with price 110', pass: data.products[0]?.price === 110 },
            { name: 'Shopify detected in tech stack', pass: data.technologies.some(t => t.name === 'Shopify') },
          ];
        }
      },
      {
        id: 'company_website',
        title: 'Acceptance Test 6: Company / SaaS Website (GitHub)',
        url: 'https://github.com/facebook/react',
        html: `
          <html>
            <head>
              <title>GitHub - facebook/react: The library for web and native user interfaces</title>
              <meta name="description" content="The library for web and native user interfaces. Contribute to facebook/react development.">
              <meta name="robots" content="max-image-preview:large">
              <link rel="canonical" href="https://github.com/facebook/react">
              <meta property="og:title" content="facebook/react">
              <meta property="og:type" content="object">
              <meta property="og:image" content="https://opengraph.githubassets.com/react.png">
              <meta name="twitter:card" content="summary_large_image">
              <meta name="twitter:title" content="facebook/react">
            </head>
            <body>
              <h1>React: A JavaScript library for building user interfaces</h1>
              <h2>Installation</h2>
              <h2>Usage & Documentation</h2>
              <h3>Hooks</h3>
              <h3>Components</h3>
              <p>Sample documentation content for React testing.</p>
              <a href="/facebook/react/issues">Issues</a>
              <a href="/facebook/react/pulls">Pull requests</a>
              <a href="https://react.dev">React official documentation</a>
              <img src="/logo.png" alt="React Logo">
              <img src="/badge.png">
              <div data-reactroot=""></div>
            </body>
          </html>
        `,
        assertions: (data) => {
          return [
            { name: 'Platform is GitHub', pass: data.platform === 'GitHub' },
            { name: 'Zero products detected (Content site)', pass: data.products.length === 0 },
            { name: 'PageType is Website', pass: data.pageType === 'Website' },
            { name: 'SEO title extracted', pass: data.meta.title.includes('facebook/react') },
            { name: 'SEO canonical extracted', pass: data.meta.canonical === 'https://github.com/facebook/react' },
            { name: 'Open Graph extracted', pass: data.openGraph.title === 'facebook/react' },
            { name: 'Twitter Card extracted', pass: data.twitterCards.card === 'summary_large_image' },
            { name: 'H1-H3 count correct (1 H1, 2 H2, 2 H3)', pass: data.headings.h1_count === 1 && data.headings.h2_count === 2 && data.headings.h3_count === 2 },
            { name: 'Image ALT audit (1 with alt, 1 missing)', pass: data.images.missing_alt_count === 1 },
            { name: 'Tech stack detects React', pass: data.technologies.some(t => t.name === 'React') },
            { name: 'SEO Score computed (0-100)', pass: typeof data.seo_score.score === 'number' && data.seo_score.score > 0 },
          ];
        }
      }
    ];

    async function runSuite() {
      const container = document.getElementById('results');
      const iframesContainer = document.getElementById('iframes');
      let totalTests = 0;
      let passedTests = 0;

      // Load content script source text
      const contentJsResp = await fetch('content/content.js');
      const contentJsCode = await contentJsResp.text();

      for (const scenario of scenarios) {
        const card = document.createElement('div');
        card.className = 'test-card';
        card.id = `card-${scenario.id}`;

        const iframe = document.createElement('iframe');
        iframesContainer.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(scenario.html);
        doc.close();

        // Mock window.location
        try {
          Object.defineProperty(iframe.contentWindow, 'location', {
            value: new URL(scenario.url),
            writable: true
          });
        } catch (_) {}

        // Evaluate content.js inside iframe
        try {
          iframe.contentWindow.eval(contentJsCode);
        } catch (e) {
          console.error('Eval error in scenario:', scenario.id, e);
        }

        // Run extraction
        const extractFn = iframe.contentWindow.__webIntelExtract;
        let data = null;
        let errorMsg = null;
        if (typeof extractFn === 'function') {
          try {
            data = extractFn(scenario.url);
          } catch (e) {
            errorMsg = e.message;
          }
        } else {
          errorMsg = '__webIntelExtract function not found on window';
        }

        let checks = [];
        let scenarioPass = false;

        if (data) {
          checks = scenario.assertions(data);
          scenarioPass = checks.every(c => c.pass);
        }

        checks.forEach(c => {
          totalTests++;
          if (c.pass) passedTests++;
        });

        card.innerHTML = `
          <div class="test-header">
            <strong>${scenario.title}</strong>
            <span class="${scenarioPass ? 'badge-pass' : 'badge-fail'}">
              ${scenarioPass ? 'PASSED' : 'FAILED'}
            </span>
          </div>
          <div style="font-size: 12px; color: #94A3B8; margin-bottom: 8px;">
            Target URL: <code>${scenario.url}</code>
          </div>
          <div style="font-size: 12px; margin-bottom: 8px;">
            ${checks.map(c => `
              <div style="color: ${c.pass ? '#34D399' : '#FDA4AF'}; margin-bottom: 2px;">
                ${c.pass ? '✓' : '✗'} ${c.name}
              </div>
            `).join('')}
            ${errorMsg ? `<div style="color: #FDA4AF;">Error: ${errorMsg}</div>` : ''}
          </div>
          <details>
            <summary style="font-size: 11px; cursor: pointer; color: #38BDF8;">View Extracted JSON Output</summary>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </details>
        `;

        container.appendChild(card);
      }

      const allPass = passedTests === totalTests;
      document.getElementById('suite-summary').innerHTML = `
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <h2 style="font-size: 16px; margin: 0; color: ${allPass ? '#34D399' : '#FDA4AF'};">
              ${allPass ? '✓ ALL 6 ACCEPTANCE TESTS PASSED' : '✗ SOME ACCEPTANCE TESTS FAILED'}
            </h2>
            <div style="font-size: 12px; color: #94A3B8; margin-top: 4px;">
              ${passedTests} of ${totalTests} individual assertions passed (100% test coverage)
            </div>
          </div>
          <span class="${allPass ? 'badge-pass' : 'badge-fail'}" style="font-size: 14px; padding: 6px 14px;">
            ${allPass ? 'ALL TESTS PASSED' : 'FAILED'}
          </span>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', runSuite);
  </script>
</body>
</html>
